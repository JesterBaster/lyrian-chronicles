name: Release

# Publishing a GitHub Release tagged v0.1.0 builds and attaches the assets.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Read and validate the version from the tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be vMAJOR.MINOR.PATCH with an optional prerelease suffix."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Stamp version and URLs into system.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          export MANIFEST="https://github.com/${REPO}/releases/latest/download/system.json"
          export DOWNLOAD="https://github.com/${REPO}/releases/download/${TAG}/system.zip"

          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("system.json", "utf8"));
            m.version = process.env.VERSION;
            m.manifest = process.env.MANIFEST;
            m.download = process.env.DOWNLOAD;
            m.url = `https://github.com/${process.env.REPO}`;
            fs.writeFileSync("system.json", JSON.stringify(m, null, 2) + "\n");
          '
          echo "--- system.json ---"
          cat system.json
        shell: bash

      - name: Run automated tests against the stamped manifest
        run: node --test tests/*.test.mjs

      - name: Validate source files
        run: |
          find module migrations -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          find . -type f -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))'

      - name: Build the package
        run: |
          # Foundry expects system.json at the root of the archive, not inside a folder.
          zip -r system.zip \
            system.json README.md LICENSE.txt ATTRIBUTION.md \
            module/ migrations/ templates/ styles/ lang/ packs/ content/ images/ \
            -x '*.git*' '*.DS_Store'

          # Fail loudly rather than shipping an archive Foundry cannot install.
          unzip -l system.zip | grep -q ' system.json$' || { echo "system.json not at archive root"; exit 1; }
          for required in module/lyrian.mjs styles/lyrian.css lang/en.json content/materials-01.json content/mods-01.json content/crafting-guide-01.json; do
            unzip -l system.zip | grep -q " $required$" || { echo "missing $required"; exit 1; }
          done
          echo "archive contents verified"
          unzip -l system.zip | head -20

      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" system.json system.zip --clobber
